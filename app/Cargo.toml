[workspace]
resolver = "2"
members = ["crates/orchestrator-core", "crates/orchestrator-host", "crates/orchestrator-store", "crates/orchestrator-daemon", "crates/orchestrator-gui", "crates/orchestrator-bridge"]

# The real app (not a spike). Native Rust + GPUI, Focused Dark.
# Built on permissive primitives only (gpui Apache-2.0, alacritty Apache-2.0, portable-pty MIT).
[workspace.package]
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "A native macOS command center for running a fleet of AI coding-agent CLI sessions."
repository = "https://github.com/FelisAI/kod"

[workspace.dependencies]
orchestrator-core = { path = "crates/orchestrator-core" }
orchestrator-host = { path = "crates/orchestrator-host" }
orchestrator-bridge = { path = "crates/orchestrator-bridge" }
orchestrator-store = { path = "crates/orchestrator-store" }
orchestrator-daemon = { path = "crates/orchestrator-daemon" }
rusqlite = { version = "0.40", features = ["bundled"] }
gpui = "0.2.2"
# 0.5.6 references ARM SIMD intrinsics removed in this nightly; pin to the known-good rev.
pathfinder_simd = "=0.5.5"
# terminal hosting substrate (docs/012 §1) — same pins the fps spike proved
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "9d9640d4" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# compact binary codec for the daemon wire (docs/018 §4) — grid snapshots as JSON
# would be needlessly fat. 1.3 = the stable, simple serialize/deserialize API.
bincode = "3.0"
# timezone-aware civil datetime math for the usage-limit reset instant (DST-
# correct via zoned arithmetic — never a fixed offset). docs/019 auto-continue.
jiff = "0.2"
libc = "0.2"
